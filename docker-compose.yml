# 演示 / 验收环境（占位）：完整的 mysql + backend + frontend 编排在 T-062 中完成。
# 目前只包含 MySQL，与 docker-compose.dev.yml 等价，便于后续在此基础上追加服务。
name: xiaoying

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xiaoying}
      MYSQL_USER: ${MYSQL_USER:-xiaoying}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-xiaoying}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  # backend:  T-062
  # frontend: T-062

volumes:
  mysql-data:
