# 公共配置。所有值都可以被环境变量覆盖（Spring relaxed binding，如 SPRING_DATASOURCE_URL、APP_STORAGE_ROOT）。
# profile：dev（本地开发）/ test（自动化测试）/ demo（docker compose 演示）/ prod
spring:
  application:
    name: xiaoying-backend
  profiles:
    default: dev

  datasource:
    # URL 必须带 connectionTimeZone=UTC：数据库 DATETIME(3) 存 UTC（database.md §0）
    url: ${DB_URL:jdbc:mysql://localhost:3307/xiaoying?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:xiaoying}
    password: ${DB_PASSWORD:xiaoying}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    # 启动时自动建表、写种子（V1__init_schema.sql、V2__seed_data.sql）；已执行的迁移不会重复执行
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      # 全局上限，超限返回 413 PAYLOAD_TOO_LARGE [OQ-18]；单模板的更小上限在业务层校验
      max-file-size: 5MB
      max-request-size: 20MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
  error:
    # 不向前端暴露堆栈 / 异常信息（统一错误由 GlobalExceptionHandler 输出）
    include-stacktrace: never
    include-message: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        # 只暴露 health，供 compose 健康检查和前端探活
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      # 不生成 liveness / readiness 分组，响应只有 {"status":"UP"}（api.yaml /actuator/health）
      probes:
        enabled: false
