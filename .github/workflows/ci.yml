name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: frontend (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API types are up to date with docs/api.yaml
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api/schema.d.ts || {
            echo "::error::src/lib/api/schema.d.ts is stale. Run 'npm run gen:api' and commit the result."
            exit 1
          }
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: backend (mvn verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Ubuntu runner 自带 Docker，Testcontainers（*IT）直接使用；
      # surefire（*Test）或 failsafe（*IT）任一用例失败都会让 verify 失败
      - run: ./mvnw -B verify
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore

  docker:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images and start all services
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Frontend proxies to backend
        run: |
          curl -fsS http://localhost:3000/actuator/health | tee /dev/stderr | grep -q '"status":"UP"'
          curl -fsS -o /dev/null http://localhost:3000/
      # 演示环境（SPRING_PROFILES_ACTIVE=demo）闭环：登录 demo1 → 提交 → 成功 / 指定阶段失败
      - name: Demo flow smoke test
        run: scripts/smoke-demo.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
